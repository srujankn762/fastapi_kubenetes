name: Build and Push Docker Image

# Run workflow whenever code is pushed to main
# Also allows us to manually run the workflow from GitHub
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required by the workflow
permissions:
  # Allows GitHub Actions to read the repository
  contents: read

  # Allows GitHub Actions to push Docker images to GHCR
  packages: write

jobs:
  build-and-push:

    # GitHub provides a temporary Ubuntu machine to run this job
    runs-on: ubuntu-latest

    steps:

      # Clone/checkout our repository into the GitHub Actions runner
      - name: Check out repository
        uses: actions/checkout@v4


      # Login to GitHub Container Registry (GHCR)
      # GITHUB_TOKEN is automatically generated by GitHub Actions
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Generate Docker image tags and metadata
      # Example:
      # ghcr.io/srujankn762/fast-api_kubernetes:latest
      # ghcr.io/srujankn762/fast-api_kubernetes:<commit-sha>
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=


      # Build the Docker image using our Dockerfile
      # and push the built image to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:

          # Docker build context
          context: ./fastapi-hello-world

          # Dockerfile used for the build
          file: ./fastapi-hello-world/Dockerfile

          # Push the image to GHCR after successful build
          push: true

          # Apply the tags generated by the metadata step
          tags: ${{ steps.meta.outputs.tags }}

          # Add OCI metadata labels to the image
          labels: ${{ steps.meta.outputs.labels }}