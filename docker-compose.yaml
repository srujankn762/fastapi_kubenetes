services:
  fastapi_backend:
    # method1 : Pull the already-built FastAPI image from GHCR
    # image: ghcr.io/srujankn762/fast-api_kubernetes:latest

    # Method 2: Build the Docker image locally using the Dockerfile
    build:
      # Folder Docker uses as the build context
      # Build context => the folder Docker is allowed to see and use while building your image.
      context: ./fastapi-hello-world
      # Dockerfile used to build the image
      dockerfile: Dockerfile

    # Give the running container a readable name
    container_name: fastapi-hello-world

    # Map Machine port 8000 to container port 8000
    ports:
      - "8000:8000"

    # Map local code directly into the container
    volumes:
      # Local machine's folder path : Container's folder path
      - ./fastapi-hello-world:/app
    
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql_database:3306/${MYSQL_DATABASE}
    # Restart the container automatically unless manually stopped
    #restart: unless-stopped
    # To run the server and reload it when the code is changed
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    depends_on:
      - mysql_database

  mysql_database:
    # Official MySQL Docker image
    image: mysql:8.4

    # Initial database configuration
    environment:
      #Creating database customer_db
      #Creating user fastapi_user
      #Giving user fastapi_user access to schema customer_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    # Machine port : Container port
    ports:
      - "3308:3306"

    # Store MySQL database files in a persistent Docker volume
    volumes:
      - mysql_data:/var/lib/mysql

  # Collects and stores FastAPI metrics
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      # Prometheus configuration
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

      # Persistent metrics storage
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  # Visualizes metrics using dashboards
  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    volumes:
      # Persistent dashboards and settings
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

# Persisted volumes
volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

