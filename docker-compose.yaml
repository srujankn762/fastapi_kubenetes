services:
  fastapi_backend:
    # method1 : Pull the already-built FastAPI image from GHCR
    # image: ghcr.io/srujankn762/fast-api_kubernetes:latest

    # Method 2: Build the Docker image locally using the Dockerfile
    build:
      # Folder Docker uses as the build context
      # Build context => the folder Docker is allowed to see and use while building your image.
      context: ./fastapi-hello-world
      # Dockerfile used to build the image
      dockerfile: Dockerfile

    # Give the running container a readable name
    container_name: fastapi-hello-world

    # Map Machine port 8000 to container port 8000
    ports:
      - "8000:8000"

    # Map local code directly into the container
    volumes:
      # Local machine's folder path : Container's folder path
      - ./fastapi-hello-world:/app
    
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql_database:3306/${MYSQL_DATABASE}
    # Restart the container automatically unless manually stopped
    #restart: unless-stopped
    # To run the server and reload it when the code is changed
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    depends_on:
      - mysql_database

  mysql_database:
    # Official MySQL Docker image
    image: mysql:8.4

    # Initial database configuration
    environment:
      #Creating database customer_db
      #Creating user fastapi_user
      #Giving user fastapi_user access to schema customer_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    # Machine port : Container port
    ports:
      - "3308:3306"

    # Store MySQL database files in a persistent Docker volume
    volumes:
      - mysql_data:/var/lib/mysql

  # Collects and stores FastAPI metrics
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      # Prometheus configuration
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

      # Persistent metrics storage
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  # Visualizes metrics using dashboards
  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    volumes:
      # Persistent dashboards and settings
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
  # Stores application logs
  loki:
    image: grafana/loki:3.5.0
    ports:
      # Other machines cannot normally access it directly through the host's network interfaces
      - "127.0.0.1:3100:3100"
    volumes:
      # Loki configuration
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro

      # Persistent log storage
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    restart: unless-stopped

  # Collects Docker logs and forwards them to Loki
  alloy:
    image: grafana/alloy:v1.10.2
    volumes:
      # Alloy configuration
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro

      # Read-only access to Docker API
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Persistent Alloy state
      - alloy_data:/var/lib/alloy/data
    command:
      - "run"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
    restart: unless-stopped

  # Stores distributed traces from OpenTelemetry
  tempo:
    image: grafana/tempo:2.8.2

    # Expose Tempo's HTTP API only on localhost
    ports:
      - "127.0.0.1:3200:3200"

    # Mount Tempo configuration and persistent trace storage
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

    # Load Tempo configuration
    command:
      - "-config.file=/etc/tempo/tempo.yaml"

    restart: unless-stopped


# Persisted volumes
volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:

