apiVersion: v1
kind: Namespace
metadata:
  name: fastapi-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastapi-backend-config
  namespace: fastapi-app
data:
  # Docker Desktop host gateway reaches the unchanged Compose MySQL port.
  DB_HOST: host.docker.internal
  DB_PORT: "3308"
  MYSQL_DATABASE: customer_db
  # Alloy publishes OTLP/gRPC on the Docker Desktop host port 4317.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317
