apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-backend
  namespace: fastapi-app
spec:
  # Start with one pod; roll out updates without dropping the old pod first.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fastapi-backend
  template:
    metadata:
      labels:
        app: fastapi-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: fastapi
          # Locally built into Docker Desktop's image store; see README for GHCR.
          image: fastapi-backend:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            # Keep operational settings and credentials in separate resources.
            - configMapRef:
                name: fastapi-backend-config
            - secretRef:
                name: fastapi-backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
