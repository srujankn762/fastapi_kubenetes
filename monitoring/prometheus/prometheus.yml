global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "fastapi_backend:8000"

# Why fastapi_backend:8000 instead of localhost:8000?
# Prometheus runs inside its own Docker container.
# It must connect to FastAPI using the Docker Compose service name.