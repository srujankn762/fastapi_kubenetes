global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8001"

# In Kubernetes mode, keep `kubectl port-forward --address 0.0.0.0` running
# on host port 8001; Docker Desktop containers reach the host via this name.
